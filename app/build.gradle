plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xxxyx.cultivation'
    compileSdk 34

    defaultConfig {
        applicationId "com.xxxyx.cultivation"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // 为方便首次构建直接安装，使用内置调试签名做 release。
            // 如需正式上架，请替换为自有 keystore（参考 keystore.properties）。
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 复用 debug 签名以产出可安装的 release apk
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 沙箱环境下 lint 工具初始化失败，关闭发布构建的强制检查以保证 APK 可产出
        abortOnError false
        checkReleaseBuilds false
    }

    // 资源文件不做压缩，便于读取 raw 中的音频
    aaptOptions {
        noCompress 'wav'
    }
}

dependencies {
    // 仅使用 AndroidX 基础库，保持轻量
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
